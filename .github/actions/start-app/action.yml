name: Start the app
description: >
  Runs the exact image digest under test on this runner — read-only root,
  all capabilities dropped — and waits for /healthz. Stand-in for the UAT
  environment until G3 runs against a GitOps-deployed UAT namespace.

inputs:
  image:
    description: image@sha256:… (the G2 digest)
    required: true

outputs:
  url:
    value: http://127.0.0.1:8080

runs:
  using: composite
  steps:
    - shell: bash
      env:
        IMAGE_REF: ${{ inputs.image }}
      run: |
        set -uo pipefail
        docker run -d --name app -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp \
          --cap-drop ALL --security-opt no-new-privileges "$IMAGE_REF" || exit 1
        for _ in $(seq 30); do
          curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && exit 0
          sleep 2
        done
        docker logs app | tail -50
        echo "::error::app did not become ready"
        exit 1
