# Progressive delivery: half the replicas move to the new digest, the
# AnalysisTemplate probes the canary, and only a passing analysis promotes
# to 100%. A failed analysis aborts and scales the canary back to stable.
#
# Data: notes live in the memory of a single gunicorn worker (the Dockerfile
# pins --workers 1 so every request reaches the same process). Each pod has
# its own notes and nothing survives a restart — enough for gate and canary
# testing, not a data design. No Secret is mounted: this app has no
# credentials.
#
# Shared by every environment; deploy/<env>/ sets the namespace, the replica
# count (where it differs) and the image digest. deploy/kind is an overlay of
# this base too, for the kind cluster.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: flask-gates-demo
  labels:
    app: flask-gates-demo
  annotations:
    # Accepted, documented exception to the G2 iac_clean checkov scan:
    checkov.io/skip1: CKV2_K8S_6=NetworkPolicy is platform-owned; the Argo CD AppProject forbids product repos from shipping one
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: flask-gates-demo
  strategy:
    canary:
      canaryService: flask-gates-demo-canary
      stableService: flask-gates-demo-stable
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: flask-gates-demo-canary-health
        - setWeight: 100
  template:
    metadata:
      labels:
        app: flask-gates-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flask-gates-demo
          # Kustomize `images:` rewrites this to ghcr.io/...@sha256:<digest>.
          image: flask-gates-demo
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              # Explicit, not defaulted: the Rollout CRD has no defaulting, so
              # an unset protocol (live: TCP) kept Argo CD OutOfSync forever.
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            # Also set at pod level; Kyverno disallow-privileged checks the container.
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          # The image runs with a read-only root filesystem, so gunicorn's
          # worker heartbeat files and control socket need a writable /tmp
          # (HOME=/tmp in the Dockerfile too). Notes are in memory, so this is
          # the only path the app writes.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
