[project]
name = "flask-gates-demo"
version = "0.1.0"
description = "Minimal Flask notes API for testing the DevSecOps gates end to end"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "gunicorn>=23",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
